name: Release Linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.0.1). Required when running manually."
        required: true
        type: string

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      checkout_ref: ${{ github.event.inputs.tag || github.ref }}

  publish-tauri:
    needs: quality
    permissions:
      contents: write
    strategy:
      # This release channel intentionally publishes Linux packages only.
      # Cross-platform checks still run through the reusable quality workflow.
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            # AppImage is excluded on purpose: linuxdeploy's GTK plugin is
            # chronically broken on GitHub runners (FUSE-less, "failed to run
            # linuxdeploy" with no output). deb + rpm cover Linux installs and
            # are both supported by the in-app updater.
            args: "--target x86_64-unknown-linux-gnu --bundles deb,rpm"
            label: "Linux x64"
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.target }}

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Load versioned release notes
        id: release-notes
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          STABLE_VERSION="${VERSION%%-*}"
          NOTES_PATH="docs/releases/v${VERSION}.md"
          if [[ ! -f "$NOTES_PATH" ]]; then
            NOTES_PATH="docs/releases/v${STABLE_VERSION}.md"
          fi
          if [[ ! -f "$NOTES_PATH" ]]; then
            echo "Missing release notes for ${RELEASE_TAG}" >&2
            exit 1
          fi
          RENDERED_NOTES="$RUNNER_TEMP/metacodex-release-notes.md"
          sed \
            -e "s|/blob/v${STABLE_VERSION}/|/blob/${GITHUB_SHA}/|g" \
            -e "s|/v${STABLE_VERSION}/docs/releases/assets/|/${GITHUB_SHA}/docs/releases/assets/|g" \
            "$NOTES_PATH" > "$RENDERED_NOTES"
          {
            echo 'body<<METACODEX_RELEASE_NOTES'
            cat "$RENDERED_NOTES"
            echo 'METACODEX_RELEASE_NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Build & publish to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "metacodex ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: ${{ steps.release-notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Locate Linux packages
        if: matrix.platform == 'ubuntu-22.04'
        id: linux-packages
        shell: bash
        run: |
          set -euo pipefail
          DEB_PATH="$(find src-tauri/target/${{ matrix.target }}/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          RPM_PATH="$(find src-tauri/target/${{ matrix.target }}/release/bundle/rpm -maxdepth 1 -type f -name '*.rpm' -print -quit)"
          test -n "$DEB_PATH"
          test -n "$RPM_PATH"
          echo "deb_path=$(realpath "$DEB_PATH")" >> "$GITHUB_OUTPUT"
          echo "rpm_path=$(realpath "$RPM_PATH")" >> "$GITHUB_OUTPUT"

      - name: Smoke test Debian package
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          DEB_PATH: ${{ steps.linux-packages.outputs.deb_path }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$DEB_PATH:/tmp/metacodex.deb:ro" \
            ubuntu:22.04 \
            bash -lc 'apt-get update && if ! DEBIAN_FRONTEND=noninteractive apt-get install -y dbus-x11 xvfb desktop-file-utils xdg-utils /tmp/metacodex.deb >/tmp/install.log 2>&1; then cat /tmp/install.log; exit 1; fi; bash /workspace/.github/scripts/smoke-installed-linux-package.sh'

      - name: Smoke test RPM package
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          RPM_PATH: ${{ steps.linux-packages.outputs.rpm_path }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$RPM_PATH:/tmp/metacodex.rpm:ro" \
            fedora:43 \
            bash -lc 'if ! dnf install -y dbus-daemon xorg-x11-server-Xvfb desktop-file-utils xdg-utils /tmp/metacodex.rpm >/tmp/install.log 2>&1; then cat /tmp/install.log; exit 1; fi; bash /workspace/.github/scripts/smoke-installed-linux-package.sh'

  finalize-release:
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Validate Linux updater metadata
        shell: bash
        run: |
          set -euo pipefail
          METADATA_DIR="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --pattern latest.json --dir "$METADATA_DIR"
          jq -e '
            .platforms as $platforms
            | ($platforms["linux-x86_64-deb"].url | endswith(".deb"))
            and ($platforms["linux-x86_64-deb"].signature | length > 0)
            and ($platforms["linux-x86_64-rpm"].url | endswith(".rpm"))
            and ($platforms["linux-x86_64-rpm"].signature | length > 0)
          ' "$METADATA_DIR/latest.json"

      - name: Publish the complete release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
